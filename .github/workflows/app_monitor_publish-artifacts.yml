name: "App Monitor - Publish artifacts"

on:
  workflow_call:

env:
  QT_TARGET: app_top_monitoring_qt
  CLI_TARGET: app_top_monitoring

jobs:
  publish:
    name: Publish artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Download Qt artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.QT_TARGET }}
          path: dist/qt

      - name: Download CLI artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CLI_TARGET }}
          path: dist/cli

      - name: Package release bundle
        run: |
          chmod +x dist/qt/${{ env.QT_TARGET }} dist/cli/${{ env.CLI_TARGET }}
          tar -czf ${{ env.QT_TARGET }}.tar.gz -C dist/qt ${{ env.QT_TARGET }}
          tar -czf ${{ env.CLI_TARGET }}.tar.gz -C dist/cli ${{ env.CLI_TARGET }}

      - name: Publish combined artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neo-monitoring-release
          path: |
            ${{ env.QT_TARGET }}.tar.gz
            ${{ env.CLI_TARGET }}.tar.gz
          retention-days: 30

      # Optional: attach the same bundle to a GitHub Release when the
      # push is a version tag (e.g. v1.2.0). Remove this step if you
      # don't tag releases.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.QT_TARGET }}.tar.gz
            ${{ env.CLI_TARGET }}.tar.gz
