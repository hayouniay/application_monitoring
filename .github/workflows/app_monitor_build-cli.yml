name: "App Monitor - Build console app"

on:
  workflow_call:

env:
  BUILD_DIR: build
  CLI_TARGET: app_top_monitoring

jobs:
  build-cli:
    name: Build console app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Build CLI target
        run: make cli

      - name: Upload CLI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CLI_TARGET }}
          path: ${{ env.BUILD_DIR }}/${{ env.CLI_TARGET }}
          if-no-files-found: error
          retention-days: 7
