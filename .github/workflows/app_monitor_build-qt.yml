name: "App monitor - Build Qt app"

on:
  workflow_call:

env:
  BUILD_DIR: build
  QT_TARGET: app_top_monitoring_qt

jobs:
  build-qt:
    name: Build Qt app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev

      - name: Build Qt target
        run: make qt

      - name: Upload Qt build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.QT_TARGET }}
          path: ${{ env.BUILD_DIR }}/${{ env.QT_TARGET }}
          if-no-files-found: error
          retention-days: 7
